services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kite
      POSTGRES_PASSWORD: kite_local_only
      POSTGRES_DB: kite_bounty
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - kite_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kite -d kite_bounty"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  kite_postgres:
